# Every push and pull request: KEYFALL's host tests, Dinghy's platform tests and the real FM-1 package, built and
# attested by the shared zvenson/fm1-build workflow (JieLi toolchain + AC79 SDK), as RoboSeq and SkurkyMello do. A tag
# vX.Y also publishes the release. (Every branch builds: the .fwsc of a work branch is what fm1-emu measures.)
name: build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    uses: zvenson/fm1-build/.github/workflows/build.yml@v1
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      build: |
        if [ "$GITHUB_REF_TYPE" = tag ]; then ./build.sh --release "${GITHUB_REF_NAME#v}"; else ./build.sh; fi
      test: sh tests/run_keyfall.sh && sh tests/run_tests.sh
      packages: build/keyfall*.fwsc
