# Every push and pull request: VaveHero's host tests, Dinghy's platform tests and the real FM-1 package, built and
# attested by the shared zvenson/fm1-build workflow (JieLi toolchain + AC79 SDK), as RoboSeq and SkurkyMello do. A tag
# vX.Y also publishes the release. (Every branch builds: the .fwsc of a work branch is what fm1-emu measures.)
name: build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    uses: zvenson/fm1-build/.github/workflows/build.yml@v1
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      build: |
        if [ "$GITHUB_REF_TYPE" = tag ]; then ./build.sh --release "${GITHUB_REF_NAME#v}"; else ./build.sh; fi
      test: sh tests/run_vavehero.sh && sh tests/run_tests.sh && sh tools/emu_ci.sh
      packages: build/vavehero*.fwsc

  # The site (GitHub Pages, https://joakimskurk.github.io/fm1vavehero/): VaveHero's page and its installer in the
  # browser (Web MIDI), and the game in the browser (web/make_site.py). The page installs the newest release (its
  # .fwsc, as the release has it); until there is one, the package this run built and tested. From the default branch
  # only (a push, or run by hand: Actions -> build -> Run workflow), so a release shows on the page from the next run. GitHub Pages has to be switched on once, by the repository's owner: Settings ->
  # Pages -> Build and deployment -> Source: GitHub Actions. Until then this job says so and publishes nothing (the
  # build stays green). As FM-1 Clock's.
  site:
    needs: build
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: packages
      - name: GitHub Pages switched on?
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/pages" >/dev/null 2>&1; then
            echo "on=1" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=GitHub Pages is off::Settings -> Pages -> Build and deployment -> Source: GitHub Actions, then run the build again"
            echo "on=0" >> "$GITHUB_OUTPUT"
          fi
      - name: The package the page installs
        id: pkg
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName 2>/dev/null || true)
          if [ -n "$tag" ] && gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern "vavehero-${tag#v}.fwsc" -D rel; then
            echo "file=rel/vavehero-${tag#v}.fwsc" >> "$GITHUB_OUTPUT"; echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
            echo "::notice title=The page installs::the release $tag"
          else
            echo "file=build/vavehero.fwsc" >> "$GITHUB_OUTPUT"; echo "version=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
            echo "::notice title=The page installs::this run's build (no release yet)"
          fi
      - name: The site
        run: python3 web/make_site.py "${{ steps.pkg.outputs.file }}" "${{ steps.pkg.outputs.version }}" _site
      - uses: actions/upload-pages-artifact@v3
        if: steps.pages.outputs.on == '1'
        with:
          path: _site
      - id: deploy
        if: steps.pages.outputs.on == '1'
        uses: actions/deploy-pages@v4
